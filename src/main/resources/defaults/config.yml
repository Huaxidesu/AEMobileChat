# GTNHChat 配置
#
# 改完执行 /gtchat reload 生效。文件用 UTF-8 保存，缩进只能用空格。

# 本服标识。跨服转发时用来标记消息来源，也用于去重。
# 同一个代理下的每台服务器必须不同。
server:
  id: server1
  display: 服务器

chat:
  # 一条玩家消息最多保留多少字符，超出截断。
  # 带任务分享标记的消息不截断，截断会让链接失效。
  max-length: 256
  # 客户端在名字前画头像时（NecroTempus 的 ChatHeads），名字两侧要不要留边。
  # 头像是客户端画的 8×8 贴图，固定贴在名字第一个字符的位置上、右边只留 1px，
  # 左边和前面的括号是 0px —— 不开这个概念时整行看起来是挤在一起的。
  #   auto  有客户端上报「开着头像」时才留边（客户端装 1.1.2 及以上才会上报）
  #   on    总是留（玩家用 NecroTempus 但不装本模组客户端时用这个）
  #   off   从不留
  # 留边只补名字左边一个空格，悬停提示和点击命令里的名字不受影响。
  chat-heads: auto
  # 规则从上往下匹配，第一条满足条件的生效。
  #   permission: 权限节点；没有权限插件时按 op 等级判断
  #   op:         需要的 op 等级，0-4
  # 两个条件都不写表示任何玩家都匹配。顺序就是文件里的书写顺序。
  #
  # 规则里的 {playerop} 是 style.yml 里同名片段，管理员的名字用它显示成红色；
  # 普通玩家用 {player}。想让管理员换别的样式，改 style.yml 的 playerop 即可。
  rules:
    admin:
      op: 1
      layout: '{server}{world}{team}{playerop}&f: {message}'
    default:
      layout: '{server}{world}{team}{player}&f: {message}'

# 世界名显示。没列出的维度用维度自身的名字。
world-names:
  '0': 主世界
  '-1': 下界
  '1': 末地

relay:
  enabled: true
  # 跨服消息走 BungeeCord 的 Forward 子通道，代理端不需要装任何东西。
  channel: gtnchat
  # 协议版本，各服必须一致；不一致的消息直接丢弃。
  protocol: 1
  # 转发过来的消息是否保留点击动作。
  # 默认关闭：点击命令在别的服务器上执行通常没有意义。
  keep-click: false
  # 跨服消息额外写一条带来源的日志，例如「[跨服] 生存 → 主城: <Steve> 你好」。
  # sendChatMsg 自己那条日志只有渲染后的文本，翻日志时不好确认来自哪台服。
  log: true

achievements:
  enabled: true
  # 玩家达成成就时的公告。
  #   {player} 玩家名   {achievement} 成就名
  layout: '&e{player} &7达成了成就 &b{achievement}'

# NEI 物品分享的跨服转发。各服都要装 NEI，否则自动跳过。
nei:
  enabled: true
  #   {player} 玩家名   {item} 物品（带悬停提示，点击可加入 NEI 书签）
  layout: '&e{player} &7分享了 {item}'

# 调试输出。正常运行时保持 false。
debug: false
